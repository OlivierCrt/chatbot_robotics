  - ask_jacobian
  - ask_code_example
  - ask_advanced_analysis
  - ask_workspace
  - help
  - affirm
  - deny
  - provide_coordinates
  - provide_angles

entities:
  - coordinate_x
  - coordinate_y
  - coordinate_z
  - angle_q1
  - angle_q2
  - angle_q3
  - velocity
  - acceleration

slots:
  point_a_x:
    type: float
    influence_conversation: true
  point_a_y:
    type: float
    influence_conversation: true
  point_a_z:
    type: float
    influence_conversation: true
  point_b_x:
    type: float
    influence_conversation: true
  point_b_y:
    type: float
    influence_conversation: true
  point_b_z:
    type: float
    influence_conversation: true
  velocity_1:
    type: float
    influence_conversation: true
  velocity_2:
    type: float
    influence_conversation: true
  acceleration:
    type: float
    influence_conversation: true
  q1:
    type: float
    influence_conversation: true
  q2:
    type: float
    influence_conversation: true
  q3:
    type: float
    influence_conversation: true
  simulation_mode:
    type: text
    influence_conversation: true
  last_calculation:
    type: text
    influence_conversation: false

responses:
  utter_greet:
  - text: "Salut. Je suis votre assistant en robotique. Je peux vous expliquer les concepts, lancer des simulations et effectuer des calculs cinematiques. Dites-moi simplement ce que vous souhaitez faire, comme apprendre les bases ou lancer une simulation."

  utter_robot_basics:
  - text: |
      Un robot fonctionne avec 3 composants principaux :
      1. Les Capteurs : Pour percevoir l'environnement (cameras, capteurs de force, encodeurs).
      2. Le Controleur : Le cerveau qui analyse et decide (ordinateur, microcontroleur).
      3. Les Actionneurs : Pour executer les mouvements (moteurs, verins).
      
      Je peux vous montrer une simulation de notre bras robot ou vous expliquer les differents types de robots.

  utter_robot_types:
  - text: |
      Il existe plusieurs types de robots :
      - Manipulateurs : Bras robots industriels (comme celui de la simulation).
      - Mobiles : Robots roulants, drones.
      - Humanoides : Robots a forme humaine.
      - Industriels : Pour la soudure, l'assemblage, ou le pick & place.
      
      Voulez-vous lancer une simulation du bras manipulateur ou comprendre ses articulations ?

  utter_articulation_general:
  - text: |
      Une articulation (ou joint) relie deux parties du robot et permet le mouvement.
      
      Les deux types principaux sont :
      - Rotoide (R) : Rotation autour d'un axe (pivot).
      - Prismatique (P) : Translation le long d'un axe (glissiere).
      
      Notre robot possede 3 articulations. Voulez-vous des details techniques ou comprendre les degres de liberte ?

  utter_articulation_specific:
  - text: |
      La Liaison Rotoide (R) permet une rotation autour d'un axe fixe avec 1 degre de liberte (angle theta), comme un coude.
      
      La Liaison Prismatique (P) permet une translation le long d'un axe avec 1 degre de liberte (distance d), comme un verin.
      
      Notre bras robot utilise 3 liaisons rotoides nommees q1, q2 et q3.

  utter_control:
  - text: |
      Le controle du robot utilise des boucles de regulation :
      - Consigne : Position desiree.
      - Mesure : Position actuelle via capteurs.
      - Erreur : Difference entre consigne et mesure.
      - Correcteur : Calcule la commande (souvent PID).
      - Actionneur : Applique la commande.
      
      Vous pouvez me demander de voir la generation de trajectoire.

  utter_dof:
  - text: |
      Les Degres De Liberte (DDL) sont les mouvements independants possibles.
      
      Dans l'espace 3D, un objet libre a 6 DDL (3 translations X, Y, Z et 3 rotations).
      
      Notre robot a 3 DDL (3 articulations rotoides) :
      - q1 : rotation de la base.
      - q2 : rotation du bras.
      - q3 : rotation de l'avant-bras.
      
      Je peux calculer la position (MGD) ou les angles (MGI) si vous le souhaitez.

  utter_trajectory:
  - text: |
      Une trajectoire definit le chemin et les vitesses du robot. Notre generateur cree des trajectoires circulaires avec un profil de vitesse trapezoidal (phases d'acceleration, vitesse constante et deceleration).
      
      Voulez-vous voir une animation ou personnaliser les parametres de la trajectoire ?

  utter_math_basics:
  - text: |
      Les matrices de transformation homogene (4x4) representent la rotation (matrice 3x3) et la translation (vecteur 3x1) du robot.
      
      Nous utilisons les parametres de Denavit-Hartenberg (DH). Je peux vous montrer le calcul du MGD ou les parametres DH.

  utter_units:
  - text: |
      Voici les unites utilisees dans notre simulation :
      - Distances : millimetres (mm).
      - Angles : radians (rad) pour les calculs internes, degres pour l'affichage.
      - Vitesses lineaires : mm/s.
      - Vitesses angulaires : rad/s.
      - Accelerations : mm/s2 ou rad/s2.
      
      Notez que PI radians vaut 180 degres.

  utter_kinematics:
  - text: |
      La cinematique etudie le mouvement sans les forces.
      
      - MGD (Modele Geometrique Direct) : Transforme les angles (q1, q2, q3) en Position (x, y, z).
      - MGI (Modele Geometrique Inverse) : Transforme la Position (x, y, z) en Angles (q1, q2, q3).
      - Jacobienne (J) : Relie les vitesses articulaires et operationnelles.
      
      Dites-moi quel calcul vous souhaitez effectuer.

  utter_example_usage:
  - text: |
      Les bras robots sont utilises dans l'industrie pour le Pick & Place (tri), la soudure, la peinture ou l'assemblage de precision.
      
      Je peux lancer une simulation d'exemple de mouvement si vous le demandez.

  utter_clarification:
  - text: "Je n'ai pas bien compris. Dites-moi ce qui n'est pas clair et je reformulerai plus simplement. Vous pouvez aussi demander de l'aide."

  utter_help:
  - text: |
      Voici ce que je peux faire pour vous :
      
      1. Apprentissage : Expliquer les bases, les articulations ou les degres de liberte.
      2. Simulation : Lancer une simulation simple ou personnalisee.
      3. Calculs : Effectuer le MGD, le MGI ou calculer la Jacobienne.
      4. Code : Vous montrer des exemples de code Python.
      
      Quelle partie voulez-vous explorer ?

  utter_ask_coordinates_a:
  - text: "Veuillez me donner les coordonnees du point de depart A au format X Y Z (en mm). Par exemple : 0 500 600."

  utter_ask_coordinates_b:
  - text: "Maintenant, donnez-moi les coordonnees du point d'arrivee B au format X Y Z (en mm)."

  utter_ask_velocities:
  - text: "Quelles vitesses et acceleration souhaitez-vous ? Donnez-les au format Vitesse1 Vitesse2 Acceleration. Par exemple : 10 20 5."

  utter_ask_angles:
  - text: "Veuillez entrer les 3 angles articulaires en degres au format q1 q2 q3. Par exemple : 45 30 -15."

  utter_simulation_launched:
  - text: "Lancement de la simulation en cours. Je genere l'animation 3D avec les graphiques de vitesse et acceleration."

  utter_calculation_result:
  - text: "Calcul termine. Voici les resultats :"

  utter_default:
  - text: "Je n'ai pas compris votre demande. Pourriez-vous reformuler ?"

actions:
  - action_run_simulation_simple
  - action_run_simulation_custom
  - action_calculate_mgd
  - action_calculate_mgi
  - action_calculate_jacobian
  - action_show_code_example
