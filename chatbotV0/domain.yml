  - utter_robot_types
  - utter_articulation
  - utter_dof
  - utter_control
  - utter_trajectory
  - utter_kinematics
  - utter_sensors
  - utter_applications
  - utter_workspace_info
  - utter_ask_help
  - utter_default
  - utter_affirm
