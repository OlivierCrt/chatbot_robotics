version: '2.0'
config:
  store_entities_as_slots: true
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
intents:
- greet:
    use_entities: true
- goodbye:
    use_entities: true
- affirm:
    use_entities: true
- deny:
    use_entities: true
- mood_great:
    use_entities: true
- mood_unhappy:
    use_entities: true
- bot_challenge:
    use_entities: true
- thank_you:
    use_entities: true
- other_picture:
    use_entities: true
entities: 
  - pet
slots: 

responses:
  utter_greet:
  - text: Hey! How are you?
  utter_cheer_up:
  - image: https://i.imgur.com/nGF1K8f.jpg
    text: 'Here is something to cheer you up:'
  utter_did_that_help:
  - text: Did that help you?
  utter_happy:
  - text: Great, carry on!
  utter_goodbye:
  - text: Bye
  utter_iamabot:
  - text: I am a bot, powered by Rasa.
  utter_welcome:
  - text: You are welcome !
  - text: You are very welcome !
  utter_other_picture:
  - image: https://media.tenor.com/x8v1oNUOmg4AAAAM/rickroll-roll.gif
    text: Here is another one
  - text: I don't have any
actions:
- action_hello_world
forms: {}
e2e_actions: []
