version: "2.0"  
intents:
  - greet
  - ask_robot_basics
  - ask_robot_types
  - ask_articulation_general
  - ask_articulation_specific
  - ask_control
  - ask_dof
  - ask_trajectory
  - ask_math_basics
  - ask_units
  - ask_kinematics
  - ask_example_usage
  - ask_clarification

responses:
  utter_greet:
  - text: "Salut ! Je suis ton assistant en robotique."

  utter_robot_basics:
  - text: "Un robot fonctionne avec des capteurs, un contrôleur et des actionneurs."

  utter_robot_types:
  - text: "Il y a les robots manipulateurs, mobiles, humanoïdes et les drones."

  utter_articulation_general:
  - text: "Une articulation relie deux parties du robot et permet le mouvement."

  utter_articulation_specific:
  - text: "Rotoïde (R) pour tourner, Prismatique (P) pour glisser."

  utter_control:
  - text: "On utilise des boucles de contrôle (PID) pour corriger les erreurs de position."

  utter_dof:
  - text: "Les degrés de liberté (DDL) sont les mouvements indépendants possibles (souvent 6)."

  utter_trajectory:
  - text: "Une trajectoire est un chemin géométrique associé à une vitesse et une accélération."

  utter_math_basics:
  - text: "On utilise des matrices de transformation homogène pour représenter la position et l'orientation."

  utter_units:
  - text: "On utilise les mètres, les radians et les Newtons."

  utter_kinematics:
  - text: "La cinématique étudie le mouvement (position, vitesse) sans les forces."

  utter_example_usage:
  - text: "Exemple : un bras industriel qui fait du 'Pick and Place' sur une chaîne de production."

  utter_clarification:
  - text: "Je n'ai pas compris. Peux-tu reformuler avec des mots simples ?"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true