  - ask_robot_basics
  - ask_robot_types
  - ask_articulation
  - ask_dof
  - ask_control
  - ask_trajectory
  - ask_kinematics
  - ask_sensors
  - ask_applications
  - calculate_mgd
  - calculate_mgi
  - calculate_jacobian
  - calculate_trajectory
  - ask_workspace
  - ask_code_example
  - provide_joint_angles
  - provide_position
  - show_robot_config
  - reset_conversation
  - ask_help
  - ask_what_learned
  - ask_quiz

entities:
  - angle_value
  - position_value
  - robot_component

slots:
  # Slots pour mémorisation des angles articulaires
  q1:
    type: float
    influence_conversation: false
    initial_value: 0.0
  q2:
    type: float
    influence_conversation: false
    initial_value: 0.0
  q3:
    type: float
    influence_conversation: false
    initial_value: 0.0
  
  # Slots pour mémorisation de positions
  target_x:
    type: float
    influence_conversation: false
  target_y:
    type: float
    influence_conversation: false
  target_z:
    type: float
    influence_conversation: false
  
  # Mémorisation du contexte d'apprentissage
  topics_learned:
    type: list
    influence_conversation: false
  
  last_calculation_type:
    type: text
    influence_conversation: false
  
  user_level:
    type: text
    influence_conversation: true
    initial_value: "debutant"
  
  # Mémorisation des paramètres du robot
  link_length_1:
    type: float
    influence_conversation: false
    initial_value: 300.0
  link_length_2:
    type: float
    influence_conversation: false
    initial_value: 250.0
  link_length_3:
    type: float
    influence_conversation: false
    initial_value: 150.0

responses:
  utter_greet:
  - text: |
      Bonjour ! Je suis RoboTeach, votre assistant pour apprendre la robotique. 🤖
      
      Je peux vous aider à :
      • Comprendre les concepts de base de la robotique
      • Effectuer des calculs cinématiques (MGD, MGI, Jacobienne)
      • Générer des trajectoires
      • Voir des exemples de code Python
      
      Par où voulez-vous commencer ? (Tapez 'aide' pour voir toutes les options)

  utter_goodbye:
  - text: "Au revoir ! N'hésitez pas à revenir pour en apprendre plus sur la robotique. À bientôt !"

  utter_robot_basics:
  - text: |
      Un robot manipulateur fonctionne grâce à 3 composants essentiels :
      
      1️⃣ **Capteurs** - Les "sens" du robot
         → Encodeurs (position des moteurs)
         → Capteurs de force/couple
         → Caméras de vision
      
      2️⃣ **Contrôleur** - Le "cerveau"
         → Ordinateur embarqué
         → Calcule les commandes en temps réel
         → Gère la sécurité
      
      3️⃣ **Actionneurs** - Les "muscles"
         → Moteurs électriques (servomoteurs)
         → Vérins pneumatiques/hydrauliques
         → Exécutent les mouvements
      
      Voulez-vous en savoir plus sur les types de robots ou les articulations ?

  utter_robot_types:
  - text: |
      Voici les principaux types de robots :
      
      🦾 **Manipulateurs** (comme notre modèle)
         → Bras articulés industriels
         → 3 à 7 degrés de liberté
         → Usage : assemblage, soudure, peinture
      
      🚗 **Mobiles**
         → Robots à roues ou chenilles
         → Drones aériens
         → Usage : livraison, exploration
      
      🤖 **Humanoïdes**
         → Forme humaine
         → Interaction sociale
         → Recherche avancée
      
      🏭 **Collaboratifs (cobots)**
         → Travaillent avec les humains
         → Sécurité renforcée
         → Usage : industrie 4.0
      
      Notre chatbot se concentre sur les manipulateurs à 3 articulations.

  utter_articulation:
  - text: |
      Les articulations (ou liaisons) connectent les segments du robot.
      
      🔄 **Liaison Rotoïde (R)** - Rotation
         → Tourne autour d'un axe fixe
         → Paramètre : angle θ (theta)
         → Exemple : coude, pivot
         → 1 degré de liberté
      
      ↔️ **Liaison Prismatique (P)** - Translation
         → Glisse le long d'un axe
         → Paramètre : distance d
         → Exemple : vérin, ascenseur
         → 1 degré de liberté
      
      Notre robot 3R possède :
      • **q1** : rotation de la base (axe vertical)
      • **q2** : rotation de l'épaule
      • **q3** : rotation du coude
      
      Chaque articulation = 1 moteur = 1 angle à contrôler !

  utter_dof:
  - text: |
      Les **Degrés De Liberté (DDL)** sont les mouvements indépendants possibles.
      
      📐 Dans l'espace 3D :
      • Un objet libre possède 6 DDL
        - 3 translations (X, Y, Z)
        - 3 rotations (roulis, tangage, lacet)
      
      🤖 Notre robot 3R :
      • 3 DDL (3 articulations rotoïdes)
      • q1, q2, q3 sont les variables articulaires
      • Peut atteindre des positions (x, y, z)
      • Mais ne peut pas contrôler l'orientation complète
      
      ⚠️ Règle importante :
      Pour atteindre n'importe quelle position ET orientation dans l'espace (6 DDL), il faut au minimum 6 articulations !
      
      Voulez-vous voir un calcul de position avec les angles actuels ?

  utter_control:
  - text: |
      Le contrôle d'un robot utilise une **boucle d'asservissement** :
      
      📊 Schéma de contrôle :
      Consigne → [+] → Correcteur → Actionneur → Système
                  ↑ -                              ↓
                  └────── Capteur ←─────────────────┘
      
      1. **Consigne** : position/vitesse désirée
      2. **Erreur** : différence (consigne - mesure)
      3. **Correcteur PID** :
         • P (Proportionnel) : réagit à l'erreur actuelle
         • I (Intégral) : corrige l'erreur accumulée
         • D (Dérivé) : anticipe l'erreur future
      4. **Actionneur** : applique la commande au moteur
      5. **Capteur** : mesure la position réelle
      
      Le correcteur PID est l'algorithme le plus utilisé en robotique industrielle !

  utter_trajectory:
  - text: |
      Une **trajectoire** définit le chemin complet du robot dans le temps.
      
      📈 Composantes d'une trajectoire :
      • **Chemin** : suite de points (A → B → C...)
      • **Loi de mouvement** : vitesse à chaque instant
      
      🎯 Profil de vitesse trapézoïdal (le plus courant) :
      
      Vitesse
        ↑     ┌─────────┐
        │    ╱           ╲
        │   ╱             ╲
        │  ╱               ╲
        └─┴─────────────────┴→ Temps
          Accél  Cst  Décél
      
      Phases :
      1. **Accélération** : démarrage progressif
      2. **Vitesse constante** : déplacement rapide
      3. **Décélération** : arrêt en douceur
      
      Je peux calculer une trajectoire entre 2 points si vous voulez !

  utter_kinematics:
  - text: |
      La **cinématique** étudie le mouvement sans considérer les forces.
      
      🎯 Trois outils essentiels :
      
      **1. MGD** (Modèle Géométrique Direct)
         Angles (q1, q2, q3) → Position (x, y, z)
         Question : "Où est l'effecteur ?"
      
      **2. MGI** (Modèle Géométrique Inverse)
         Position (x, y, z) → Angles (q1, q2, q3)
         Question : "Quels angles pour atteindre ce point ?"
         ⚠️ Peut avoir plusieurs solutions ou aucune !
      
      **3. Jacobienne (J)**
         Vitesses articulaires ⟷ Vitesses opérationnelles
         dX = J × dq
         Permet de détecter les singularités
      
      Quel calcul voulez-vous effectuer ?

  utter_sensors:
  - text: |
      Les **capteurs** donnent au robot la perception de son environnement.
      
      🔧 **Capteurs proprioceptifs** (état interne) :
      • Encodeurs rotatifs : mesurent les angles articulaires
      • Capteurs de couple : mesurent les forces dans les moteurs
      • Accéléromètres : détectent les vibrations
      
      👁️ **Capteurs extéroceptifs** (environnement) :
      • Caméras : vision 2D/3D
      • Capteurs laser (LIDAR) : mesure de distance
      • Capteurs de force/pression : détection de contact
      • Capteurs tactiles : manipulation délicate
      
      Les encodeurs sont essentiels : sans eux, le robot serait "aveugle" sur sa propre position !

  utter_applications:
  - text: |
      Les bras robots sont omniprésents dans l'industrie moderne :
      
      🏭 **Applications industrielles** :
      
      • **Pick & Place** : tri de pièces à haute cadence
      • **Soudure** : assemblage automobile, précision ±0.1mm
      • **Peinture** : application uniforme, économie de matière
      • **Assemblage** : montage électronique, vissage
      • **Palettisation** : empilement de cartons
      • **Usinage** : découpe, perçage
      
      🔬 **Autres domaines** :
      • Chirurgie assistée (robot Da Vinci)
      • Laboratoires (manipulation d'échantillons)
      • Agroalimentaire (emballage)
      • Logistique (préparation de commandes)
      
      Le marché mondial de la robotique industrielle représente plus de 50 milliards $ !

  utter_workspace_info:
  - text: |
      L'**espace de travail** (workspace) est l'ensemble des points atteignables par le robot.
      
      Pour un robot 3R comme le nôtre :
      • Forme : volume de révolution (quasi-sphérique)
      • Rayon max : somme des longueurs de bras
      • Zone creuse au centre (inaccessible)
      
      Limites physiques :
      • Butées mécaniques des articulations
      • Collisions entre segments
      • Singularités (positions dégénérées)
      
      Je peux vérifier si un point est atteignable avec la commande 'vérifier workspace'.

  utter_ask_help:
  - text: |
      🤖 **Aide - Commandes disponibles** :
      
      **📚 Apprentissage** :
      • "c'est quoi un robot" - Bases de la robotique
      • "types de robots" - Catégories de robots
      • "articulations" - Liaisons rotoïdes/prismatiques
      • "degrés de liberté" - Concept de DDL
      • "contrôle" - Boucle d'asservissement
      • "trajectoire" - Génération de mouvement
      • "capteurs" - Types de capteurs
      • "applications" - Usages industriels
      
      **🧮 Calculs** :
      • "calcule MGD" - Position depuis angles
      • "calcule MGI" - Angles pour atteindre une position
      • "calcule jacobienne" - Matrice jacobienne
      • "génère trajectoire" - Trajectoire entre 2 points
      • "vérifie workspace" - Point atteignable ?
      
      **💻 Code** :
      • "montre le code" - Exemples Python
      • "config robot" - Paramètres actuels
      
      **📊 Progression** :
      • "qu'ai-je appris" - Résumé de vos apprentissages
      • "quiz" - Tester vos connaissances
      • "reset" - Recommencer
      
      Que voulez-vous faire ?

  utter_default:
  - text: |
      Je n'ai pas bien compris votre demande. 
      
      Quelques suggestions :
      • Posez une question sur la robotique
      • Demandez un calcul (MGD, MGI, jacobienne)
      • Tapez 'aide' pour voir toutes les options
      
      Reformulez votre question et je ferai de mon mieux pour vous aider !

  utter_affirm:
  - text: "Parfait ! Continuons."
  - text: "Super ! On y va."
  - text: "D'accord, c'est parti !"

  utter_deny:
  - text: "Pas de problème. Que voulez-vous faire d'autre ?"
  - text: "D'accord. Autre chose ?"

