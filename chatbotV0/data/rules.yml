version: "2.0"

rules:

- rule: Saluer toujours
  steps:
  - intent: greet
  - action: utter_greet

- rule: Dire au revoir toujours
  steps:
  - intent: goodbye
  - action: action_end_conversation

- rule: Répondre à une aide
  steps:
  - intent: ask_help
  - action: utter_ask_help

- rule: Bases de la robotique
  steps:
  - intent: ask_robot_basics
  - action: utter_robot_basics

- rule: Types de robots
  steps:
  - intent: ask_robot_types
  - action: utter_robot_types
  - action: action_illustrer

- rule: Articulations
  steps:
  - intent: ask_articulation
  - action: utter_articulation
  - action: action_illustrer

- rule: Degrés de liberté
  steps:
  - intent: ask_dof
  - action: utter_dof
  - action: action_illustrer

- rule: Contrôle robot
  steps:
  - intent: ask_control
  - action: utter_control

- rule: Trajectoires
  steps:
  - intent: ask_trajectory
  - action: utter_trajectory

- rule: Cinématique
  steps:
  - intent: ask_kinematics
  - action: utter_kinematics

- rule: Capteurs
  steps:
  - intent: ask_sensors
  - action: utter_sensors

- rule: Applications
  steps:
  - intent: ask_applications
  - action: utter_applications

- rule: Workspace info
  steps:
  - intent: ask_workspace
  - action: utter_workspace_info

- rule: Affirmation
  steps:
  - intent: affirm
  - action: utter_affirm

- rule: Négation
  steps:
  - intent: deny
  - action: utter_deny

- rule: Réinitialisation
  steps:
  - intent: reset_conversation
  - action: action_reset_slots