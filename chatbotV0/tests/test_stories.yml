version: "2.0"

stories:

- story: test path 1 - découverte simple
  steps:
  - user: |
      Salut
    intent: greet
  - action: utter_greet
  - user: |
      comment marche un robot
    intent: ask_robot_basics
  - action: utter_robot_basics
  - user: |
      montre moi une simulation
    intent: run_simulation_simple
  - action: utter_simulation_launched

- story: test path 2 - apprentissage articulations
  steps:
  - user: |
      C est quoi une articulation?
    intent: ask_articulation_general
  - action: utter_articulation_general
  - user: |
      c'est quoi un pivot ?
    intent: ask_articulation_specific
  - action: utter_articulation_specific
  - user: |
      C est quoi les degres de liberte?
    intent: ask_dof
  - action: utter_dof

- story: test path 3 - parcours cinématique
  steps:
  - user: |
      c'est quoi la cinematique ?
    intent: ask_kinematics
  - action: utter_kinematics
  - user: |
      calcule le MGD
    intent: ask_mgd
  - action: utter_mgd_example
  - user: |
      calcule le MGI
    intent: ask_mgi
  - action: utter_mgi_example

- story: test path 4 - simulation personnalisée
  steps:
  - user: |
      je veux personnaliser la simulation
    intent: run_simulation_custom
  - action: utter_simulation_launched

- story: test path 5 - calcul MGD interactif
  steps:
  - user: |
      modele geometrique direct
    intent: ask_mgd
  - action: utter_ask_angles
  - user: |
      45 30 -15
    intent: provide_angles
  - action: utter_mgd_example

- story: test path 6 - calcul MGI interactif
  steps:
  - user: |
      modele geometrique inverse
    intent: ask_mgi
  - action: utter_ask_coordinates_a
  - user: |
      500 200 100
    intent: provide_coordinates
  - action: utter_mgi_example

- story: test path 7 - aide et clarification
  steps:
  - user: |
      peux tu reformuler ?
    intent: ask_clarification
  - action: utter_clarification
  - user: |
      help
    intent: help
  - action: utter_help

- story: test path 8 - vérification workspace
  steps:
  - user: |
      espace de travail
    intent: ask_workspace
  - action: utter_ask_coordinates_a
  - user: |
      0 500 600
    intent: provide_coordinates
  - action: utter_workspace_example

- story: test path 9 - analyse avancée
  steps:
  - user: |
      analyse complete
    intent: ask_advanced_analysis
  - action: utter_ask_coordinates_a
  - user: |
      100 100 100
    intent: provide_coordinates
  - action: utter_ask_coordinates_b
  - user: |
      200 200 200
    intent: provide_coordinates
  - action: utter_ask_velocities
  - user: |
      10 10 5
    intent: provide_coordinates
  - action: utter_advanced_analysis_example