version: "2.0"

stories:

# --- TESTS DE BASE ET FONCTIONNELS (1-20) ---

- story: test path 1 - Accueil et aide
  steps:
  - user: |
      Bonjour
    intent: greet
  - action: utter_greet
  - user: |
      Aide moi
    intent: ask_help
  - action: utter_ask_help

- story: test path 2 - Découverte types et illustration
  steps:
  - user: |
      Quels sont les types de robots ?
    intent: ask_robot_types
  - action: utter_robot_types
  - action: action_illustrer

- story: test path 3 - Bases et articulations
  steps:
  - user: |
      C'est quoi le principe d'un robot ?
    intent: ask_robot_basics
  - action: utter_robot_basics
  - user: |
      C'est quoi une articulation ?
    intent: ask_articulation
  - action: utter_articulation
  - action: action_illustrer

- story: test path 4 - Degrés de liberté
  steps:
  - user: |
      C'est quoi les degrés de liberté ?
    intent: ask_dof
  - action: utter_dof
  - action: action_illustrer

- story: test path 5 - Concepts Cinématiques
  steps:
  - user: |
      Explique moi la cinématique
    intent: ask_kinematics
  - action: utter_kinematics

- story: test path 6 - Calcul MGD
  steps:
  - user: |
      Calcule le MGD
    intent: calculate_mgd
  - action: action_calculate_mgd

- story: test path 7 - Calcul MGI
  steps:
  - user: |
      Calcule le MGI
    intent: calculate_mgi
  - action: action_calculate_mgi

- story: test path 8 - Jacobienne
  steps:
  - user: |
      Matrice jacobienne
    intent: calculate_jacobian
  - action: action_calculate_jacobian

- story: test path 9 - Planification de mouvement
  steps:
  - user: |
      C'est quoi une trajectoire ?
    intent: ask_trajectory
  - action: utter_trajectory
  - user: |
      Génère une trajectoire
    intent: calculate_trajectory
  - action: action_generate_trajectory

- story: test path 10 - Espace de travail
  steps:
  - user: |
      C'est quoi l'espace de travail ?
    intent: ask_workspace
  - action: utter_workspace_info

- story: test path 11 - Contrôle et Asservissement
  steps:
  - user: |
      Comment contrôler le robot ?
    intent: ask_control
  - action: utter_control

- story: test path 12 - Capteurs et Perception
  steps:
  - user: |
      Quels capteurs utilise un robot ?
    intent: ask_sensors
  - action: utter_sensors

- story: test path 13 - Applications industrielles
  steps:
  - user: |
      À quoi ça sert un bras robot ?
    intent: ask_applications
  - action: utter_applications

- story: test path 14 - Demande de code Python
  steps:
  - user: |
      Montre moi le code
    intent: ask_code_example
  - action: action_show_code_example

- story: test path 15 - Configuration matérielle
  steps:
  - user: |
      Affiche la config
    intent: show_robot_config
  - action: action_show_robot_config

- story: test path 16 - Bilan et Quiz
  steps:
  - user: |
      Qu'ai-je appris ?
    intent: ask_what_learned
  - action: action_show_learning_summary
  - user: |
      Fais moi un quiz
    intent: ask_quiz
  - action: action_quiz_user

- story: test path 17 - Négation et Reset
  steps:
  - user: |
      Non
    intent: deny
  - action: utter_deny
  - user: |
      Reset
    intent: reset_conversation
  - action: action_reset_slots

- story: test path 18 - Affirmation simple
  steps:
  - user: |
      Oui
    intent: affirm
  - action: utter_affirm

- story: test path 19 - Enchaînement Cinématique
  steps:
  - user: |
      MGD MGI
    intent: ask_kinematics
  - action: utter_kinematics
  - user: |
      Calcule la jacobienne
    intent: calculate_jacobian
  - action: action_calculate_jacobian

- story: test path 20 - Fin de session
  steps:
  - user: |
      Au revoir
    intent: goodbye
  - action: action_end_conversation

